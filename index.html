<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaniKani Reviews</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Themes ─────────────────────────────────────────────────────────── */

    :root,
    [data-theme="dark"] {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --muted:   #8b949e;
      --text:    #e6edf3;
      --pink:    #f100a1;
      --radical: #00aaff;
      --kanji:   #f100a1;
      --vocab:   #9b59b6;
    }

    [data-theme="warm"] {
      --bg:      #161008;
      --surface: #21180d;
      --border:  #3d2e1a;
      --muted:   #a0896e;
      --text:    #f0e6d0;
      --pink:    #f100a1;
      --radical: #3ab5ff;
      --kanji:   #f100a1;
      --vocab:   #b07fd4;
    }

    [data-theme="slate"] {
      --bg:      #1e2030;
      --surface: #24273a;
      --border:  #363a4f;
      --muted:   #8087a2;
      --text:    #cad3f5;
      --pink:    #f5699c;
      --radical: #89dceb;
      --kanji:   #f5699c;
      --vocab:   #cba6f7;
    }

    [data-theme="onyx"] {
      --bg:      #21252b;
      --surface: #282c34;
      --border:  #3e4451;
      --muted:   #7f848e;
      --text:    #abb2bf;
      --pink:    #e06c9f;
      --radical: #61afef;
      --kanji:   #e06c9f;
      --vocab:   #c678dd;
    }

    [data-theme="dusk"] {
      --bg:      #1a1625;
      --surface: #221d30;
      --border:  #3a3255;
      --muted:   #8b80a8;
      --text:    #dcd6f5;
      --pink:    #f472b6;
      --radical: #7dd3fc;
      --kanji:   #f472b6;
      --vocab:   #c084fc;
    }

    [data-theme="paper"] {
      --bg:      #fafaf8;
      --surface: #f0ede7;
      --border:  #d8d4cc;
      --muted:   #7a7570;
      --text:    #1c1917;
      --pink:    #c0006e;
      --radical: #0077cc;
      --kanji:   #c0006e;
      --vocab:   #6b3fa0;
    }

    [data-theme="parchment"] {
      --bg:      #fdf8ee;
      --surface: #f5ecda;
      --border:  #d9c9a8;
      --muted:   #8a7558;
      --text:    #2e1f0a;
      --pink:    #b5004e;
      --radical: #0066bb;
      --kanji:   #b5004e;
      --vocab:   #5e3590;
    }

    [data-theme="linen"] {
      --bg:      #faf7f0;
      --surface: #ede8de;
      --border:  #cec5b5;
      --muted:   #80756a;
      --text:    #201c14;
      --pink:    #b80058;
      --radical: #006aaa;
      --kanji:   #b80058;
      --vocab:   #5a3080;
    }

    [data-theme="rose"] {
      --bg:      #fff8f6;
      --surface: #fceee9;
      --border:  #e8c8c0;
      --muted:   #9a706a;
      --text:    #2a1410;
      --pink:    #c0004a;
      --radical: #0070bb;
      --kanji:   #c0004a;
      --vocab:   #6a2e90;
    }

    [data-theme="sage"] {
      --bg:      #f4f8f2;
      --surface: #e4ede0;
      --border:  #b8ceb2;
      --muted:   #5e7858;
      --text:    #1a2818;
      --pink:    #c00068;
      --radical: #006699;
      --kanji:   #c00068;
      --vocab:   #5a2e88;
    }

    /* ── Base ── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--pink);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #userBadge {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0.35rem 0.5rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .icon-btn:hover { border-color: var(--muted); color: var(--text); }

    /* ── Settings overlay ── */
    #settingsOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    #settingsOverlay.open { display: flex; }

    #settingsPanel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      padding: 1.75rem;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .settings-header {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .settings-header h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .settings-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0.2rem;
    }

    .settings-close:hover { color: var(--text); }

    .settings-section {
      margin-bottom: 1.5rem;
    }

    .settings-section:last-child { margin-bottom: 0; }

    .settings-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.6rem;
    }

    .token-field {
      display: flex;
      gap: 0.5rem;
    }

    .token-field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      flex: 1;
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
    }

    .token-field input:focus { outline: none; border-color: var(--pink); }

    .btn-primary {
      background: var(--pink);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.85; }

    .token-hint {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .token-hint a { color: var(--pink); text-decoration: none; }
    .token-hint a:hover { text-decoration: underline; }

    /* ── Theme grid ── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.65rem;
    }

    .theme-swatch {
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .theme-swatch:hover { border-color: var(--muted); }
    .theme-swatch.active { border-color: var(--pink); }

    .swatch-preview {
      height: 40px;
      display: flex;
    }

    .swatch-bg      { flex: 1; }
    .swatch-surface { flex: 1; }

    .swatch-name {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.4rem 0.6rem;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Layout ── */
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1.25rem;
      flex: 1;
      min-width: 110px;
    }

    .stat-card .label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--pink);
      margin-top: 0.15rem;
      line-height: 1;
    }

    /* ── Period buttons ── */
    .period-buttons {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .period-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.4rem 0.9rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .period-btn:hover  { border-color: var(--pink); color: var(--pink); }
    .period-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }

    /* ── Filter checkboxes ── */
    .filter-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .filter-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.4rem 0.9rem;
      transition: border-color 0.15s, opacity 0.15s;
      user-select: none;
    }

    .filter-chip input[type="checkbox"] { display: none; }

    .filter-chip .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .filter-chip.radical { --chip-color: var(--radical); }
    .filter-chip.kanji   { --chip-color: var(--kanji); }
    .filter-chip.vocab   { --chip-color: var(--vocab); }

    .filter-chip .dot   { background: var(--chip-color); }
    .filter-chip.active { border-color: var(--chip-color); color: var(--chip-color); }
    .filter-chip.inactive { opacity: 0.4; }

    /* ── Type breakdown ── */
    .type-breakdown {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .type-count-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.1rem;
      flex: 1;
      min-width: 130px;
      transition: border-color 0.15s;
      text-align: left;
    }

    .type-count-card:hover { border-color: var(--chip-color); }
    .type-count-card.radical { --chip-color: var(--radical); }
    .type-count-card.kanji   { --chip-color: var(--kanji); }
    .type-count-card.vocab   { --chip-color: var(--vocab); }

    .type-count-card .tcc-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--chip-color);
      flex-shrink: 0;
    }

    .type-count-card .tcc-body { display: flex; flex-direction: column; }

    .type-count-card .tcc-count {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--chip-color);
      line-height: 1;
    }

    .type-count-card .tcc-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 0.15rem;
    }

    /* ── Chart ── */
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      height: 320px;
      position: relative;
    }

    #reviewChart { cursor: pointer; }

    /* ── Tabbed detail panel ── */
    #detailPanel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
      overflow: hidden;
    }

    .tab-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: -1px;
      padding: 0.75rem 0.9rem;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { border-bottom-color: var(--pink); color: var(--text); }

    .tab-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0.4rem 0.25rem;
    }

    .tab-close:hover { color: var(--text); }

    .tab-content { padding: 1.25rem; display: none; }
    .tab-content.active { display: block; }

    /* ── Item cards ── */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.65rem;
    }

    .item-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 0.65rem;
      text-align: center;
      transition: border-color 0.15s;
    }

    .item-card:hover { border-color: var(--muted); }

    .item-card .char {
      font-size: 2rem;
      line-height: 1.15;
      margin-bottom: 0.3rem;
    }

    .type-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      margin-bottom: 0.4rem;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    a.type-badge:hover { opacity: 0.75; }

    .item-card.radical        .type-badge { background: rgba(0,170,255,0.15);  color: var(--radical); }
    .item-card.kanji          .type-badge { background: rgba(241,0,161,0.15);  color: var(--kanji); }
    .item-card.vocabulary     .type-badge,
    .item-card.kana_vocabulary .type-badge { background: rgba(155,89,182,0.15); color: var(--vocab); }

    .item-meaning { font-size: 0.72rem; color: var(--muted); }
    .item-reading { font-size: 0.68rem; color: var(--muted); margin-top: 0.1rem; }

    .has-tooltip {
      cursor: help;
      text-decoration: underline dotted rgba(139,148,158,0.5);
      text-underline-offset: 2px;
    }

    /* ── Mnemonic tooltip ── */
    #tooltip {
      position: fixed;
      z-index: 9999;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      color: var(--text);
      font-size: 0.78rem;
      line-height: 1.6;
      max-width: 300px;
      padding: 0.65rem 0.85rem;
      pointer-events: none;
      display: none;
    }

    .srs-pip {
      display: inline-block;
      margin-top: 0.35rem;
      font-size: 0.62rem;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    .item-due {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .tab-heading {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--pink);
      margin-bottom: 1rem;
    }

    /* ── Messages ── */
    #statusMsg {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #errorMsg {
      background: rgba(248,81,73,0.1);
      border: 1px solid rgba(248,81,73,0.4);
      border-radius: 8px;
      color: #f85149;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      display: none;
    }
  </style>
</head>
<body>

<!-- ── Settings overlay ──────────────────────────────────────────────────── -->
<div id="settingsOverlay" onclick="overlayClick(event)">
  <div id="settingsPanel">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="settings-close" onclick="closeSettings()">✕</button>
    </div>

    <div class="settings-section">
      <div class="settings-label">API Token</div>
      <div class="token-field">
        <input type="password" id="settingsToken" placeholder="Paste your WaniKani v2 API token…" autocomplete="off">
        <button class="btn-primary" onclick="saveToken()">Save &amp; Load</button>
      </div>
      <div class="token-hint">
        Get your token at
        <a href="https://www.wanikani.com/settings/personal_access_tokens" target="_blank" rel="noopener">
          wanikani.com → Settings → API Tokens
        </a>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-label">Color Theme</div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>
  </div>
</div>

<!-- ── Header ───────────────────────────────────────────────────────────── -->
<header>
  <h1>WaniKani Reviews</h1>
  <div class="header-right">
    <span id="userBadge"></span>
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>
</header>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main>
  <div id="errorMsg"></div>
  <div id="statusMsg">Open Settings (⚙) to enter your API token.</div>

  <div id="appContent" style="display:none;">
    <div class="stats-bar"     id="statsBar"></div>
    <div class="period-buttons" id="periodBtns"></div>
    <div class="filter-row"    id="filterRow"></div>
    <div class="type-breakdown" id="typeBreakdown"></div>
    <div class="chart-wrap">
      <canvas id="reviewChart"></canvas>
    </div>

    <div id="detailPanel">
      <div class="tab-bar">
        <button id="tabBtnDay"  class="tab-btn" onclick="switchTab('day')">Reviews</button>
        <button id="tabBtnType" class="tab-btn" onclick="switchTab('type')">Type list</button>
        <button class="tab-close" onclick="closeDetailPanel()" title="Close">✕</button>
      </div>
      <div id="tabDay"  class="tab-content"></div>
      <div id="tabType" class="tab-content"></div>
    </div>
  </div>
</main>

<div id="tooltip"></div>

<script>
const PERIODS = [7, 14, 21, 30, 60, 90];

const THEMES = [
  // ── Dark ──
  { id: 'dark',      name: 'Dark',      bg: '#0d1117', surface: '#161b22', text: '#e6edf3' },
  { id: 'warm',      name: 'Warm',      bg: '#161008', surface: '#21180d', text: '#f0e6d0' },
  { id: 'slate',     name: 'Slate',     bg: '#1e2030', surface: '#24273a', text: '#cad3f5' },
  { id: 'onyx',      name: 'Onyx',      bg: '#21252b', surface: '#282c34', text: '#abb2bf' },
  { id: 'dusk',      name: 'Dusk',      bg: '#1a1625', surface: '#221d30', text: '#dcd6f5' },
  // ── Light ──
  { id: 'paper',     name: 'Paper',     bg: '#fafaf8', surface: '#f0ede7', text: '#1c1917' },
  { id: 'parchment', name: 'Parchment', bg: '#fdf8ee', surface: '#f5ecda', text: '#2e1f0a' },
  { id: 'linen',     name: 'Linen',     bg: '#faf7f0', surface: '#ede8de', text: '#201c14' },
  { id: 'rose',      name: 'Rose',      bg: '#fff8f6', surface: '#fceee9', text: '#2a1410' },
  { id: 'sage',      name: 'Sage',      bg: '#f4f8f2', surface: '#e4ede0', text: '#1a2818' },
];

const SRS_INFO = {
  1: { label: 'Apprentice I',   color: '#f85149' },
  2: { label: 'Apprentice II',  color: '#f85149' },
  3: { label: 'Apprentice III', color: '#f85149' },
  4: { label: 'Apprentice IV',  color: '#f85149' },
  5: { label: 'Guru I',         color: '#9b59b6' },
  6: { label: 'Guru II',        color: '#9b59b6' },
  7: { label: 'Master',         color: '#2188ff' },
  8: { label: 'Enlightened',    color: '#e3b341' },
};

let state = {
  token: null,
  assignments: [],
  subjectCache: {},
  dayGroups: {},
  period: 7,
  selectedDate: null,
  chart: null,
  filters: { radical: true, kanji: true, vocabulary: true },
  activeTab: null,
  theme: 'dark',
};

// ── Theme ──────────────────────────────────────────────────────────────────

function setTheme(id) {
  state.theme = id;
  document.documentElement.setAttribute('data-theme', id);
  localStorage.setItem('wk_theme', id);
  renderThemeGrid();
  if (state.chart) renderChart();
}

function loadTheme() {
  const saved = localStorage.getItem('wk_theme') ?? 'dark';
  state.theme = saved;
  document.documentElement.setAttribute('data-theme', saved);
}

function renderThemeGrid() {
  document.getElementById('themeGrid').innerHTML = THEMES.map(t => `
    <div class="theme-swatch ${t.id === state.theme ? 'active' : ''}" onclick="setTheme('${t.id}')">
      <div class="swatch-preview">
        <div class="swatch-bg"      style="background:${t.bg}"></div>
        <div class="swatch-surface" style="background:${t.surface}"></div>
      </div>
      <div class="swatch-name" style="background:${t.bg};color:${t.text}">${t.name}</div>
    </div>
  `).join('');
}

// ── Settings ───────────────────────────────────────────────────────────────

function openSettings() {
  const saved = localStorage.getItem('wk_token');
  document.getElementById('settingsToken').value = saved ? '••••••••' : '';
  renderThemeGrid();
  document.getElementById('settingsOverlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function overlayClick(e) {
  if (e.target === document.getElementById('settingsOverlay')) closeSettings();
}

async function saveToken() {
  const raw = document.getElementById('settingsToken').value.trim();
  if (!raw || raw === '••••••••') {
    if (!state.token) return;      // nothing to do
    closeSettings();
    return;
  }
  state.token = raw;
  localStorage.setItem('wk_token', raw);
  document.getElementById('settingsToken').value = '••••••••';
  closeSettings();
  await loadData();
}

// ── Helpers ────────────────────────────────────────────────────────────────

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function dateStr(v) {
  return (v instanceof Date ? v.toISOString() : v).slice(0, 10);
}

function daysArray(n) {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Array.from({ length: n }, (_, i) =>
    new Date(t.getTime() + i * 86_400_000).toISOString().slice(0, 10)
  );
}

function friendlyDate(str) {
  const today = todayStr();
  const tom   = new Date(); tom.setHours(0,0,0,0); tom.setDate(tom.getDate()+1);
  if (str === today)                           return 'Today';
  if (str === tom.toISOString().slice(0,10))  return 'Tomorrow';
  return new Date(str + 'T00:00:00').toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });
}

function wkUrl(subject) {
  const char = encodeURIComponent(subject.data.characters ?? subject.data.slug ?? '');
  switch (subject.object) {
    case 'radical':         return `https://www.wanikani.com/radicals/${subject.data.slug ?? char}`;
    case 'kanji':           return `https://www.wanikani.com/kanji/${char}`;
    case 'vocabulary':
    case 'kana_vocabulary': return `https://www.wanikani.com/vocabulary/${char}`;
    default:                return '#';
  }
}

// ── API ────────────────────────────────────────────────────────────────────

async function wkFetch(url) {
  const res = await fetch(url, {
    headers: { 'Authorization': `Bearer ${state.token}`, 'Wanikani-Revision': '20170710' }
  });
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error(`WaniKani API ${res.status}${body ? ': ' + body : ''}`);
  }
  return res.json();
}

async function fetchAllPages(url) {
  const items = [];
  let next = url;
  while (next) {
    const data = await wkFetch(next);
    items.push(...data.data);
    next = data.pages?.next_url ?? null;
  }
  return items;
}

async function ensureSubjects(ids) {
  const missing = ids.filter(id => !state.subjectCache[id]);
  if (!missing.length) return;
  for (let i = 0; i < missing.length; i += 1000) {
    const chunk = missing.slice(i, i + 1000);
    const data  = await wkFetch(`https://api.wanikani.com/v2/subjects?ids=${chunk.join(',')}`);
    for (const s of data.data) state.subjectCache[s.id] = s;
  }
}

// ── Data ───────────────────────────────────────────────────────────────────

function buildDayGroups(assignments) {
  const groups = {};
  const today  = todayStr();
  for (const a of assignments) {
    const at = a.data.available_at;
    if (!at) continue;
    const key = dateStr(at) < today ? today : dateStr(at);
    (groups[key] ??= []).push(a);
  }
  return groups;
}

// ── Load ───────────────────────────────────────────────────────────────────

async function loadData() {
  showStatus('Loading…');
  hideError();
  document.getElementById('appContent').style.display = 'none';

  try {
    const user = await wkFetch('https://api.wanikani.com/v2/user');
    document.getElementById('userBadge').textContent = user.data.username;

    const end = new Date();
    end.setDate(end.getDate() + 90);
    const url = `https://api.wanikani.com/v2/assignments`
      + `?available_before=${encodeURIComponent(end.toISOString())}`
      + `&started=true&burned=false`;

    state.assignments  = await fetchAllPages(url);
    state.dayGroups    = buildDayGroups(state.assignments);
    state.selectedDate = null;
    state.activeTab    = null;

    hideStatus();
    document.getElementById('appContent').style.display = 'block';
    renderStats();
    renderPeriodButtons();
    renderFilterCheckboxes();
    renderTypeBreakdown();
    renderChart();
    closeDetailPanel();
  } catch (e) {
    hideStatus();
    showError(e.message);
  }
}

// ── Stats ──────────────────────────────────────────────────────────────────

function renderStats() {
  const today = todayStr();
  const now    = (state.dayGroups[today] || []).length;
  const next7  = daysArray(7) .reduce((s, d) => s + (state.dayGroups[d]?.length ?? 0), 0);
  const next30 = daysArray(30).reduce((s, d) => s + (state.dayGroups[d]?.length ?? 0), 0);
  const next90 = daysArray(90).reduce((s, d) => s + (state.dayGroups[d]?.length ?? 0), 0);

  document.getElementById('statsBar').innerHTML = [
    ['Available Now', now],
    ['Next 7 Days',   next7],
    ['Next 30 Days',  next30],
    ['Next 90 Days',  next90],
  ].map(([label, value]) => `
    <div class="stat-card">
      <div class="label">${label}</div>
      <div class="value">${value.toLocaleString()}</div>
    </div>
  `).join('');
}

// ── Filters ────────────────────────────────────────────────────────────────

function subjectTypeGroup(t) {
  return (t === 'vocabulary' || t === 'kana_vocabulary') ? 'vocabulary' : t;
}

function assignmentMatchesFilters(a) {
  return state.filters[subjectTypeGroup(a.data.subject_type)] ?? true;
}

function filteredForDay(date) {
  return (state.dayGroups[date] ?? []).filter(assignmentMatchesFilters);
}

function renderFilterCheckboxes() {
  const CHIPS = [
    { key: 'radical',    label: 'Radical',    cls: 'radical' },
    { key: 'kanji',      label: 'Kanji',      cls: 'kanji'   },
    { key: 'vocabulary', label: 'Vocabulary', cls: 'vocab'   },
  ];
  document.getElementById('filterRow').innerHTML = CHIPS.map(({ key, label, cls }) => `
    <label class="filter-chip ${cls} ${state.filters[key] ? 'active' : 'inactive'}">
      <input type="checkbox" ${state.filters[key] ? 'checked' : ''}
             onchange="toggleFilter('${key}')">
      <span class="dot"></span>${label}
    </label>
  `).join('');
}

function toggleFilter(key) {
  state.filters[key] = !state.filters[key];
  renderFilterCheckboxes();
  renderChart();
  if (state.activeTab === 'day' && state.selectedDate) renderDayTab(state.selectedDate);
}

// ── Type breakdown ─────────────────────────────────────────────────────────

function renderTypeBreakdown() {
  const days   = daysArray(state.period);
  const all    = days.flatMap(d => state.dayGroups[d] ?? []);
  const counts = { radical: 0, kanji: 0, vocabulary: 0 };
  for (const a of all) counts[subjectTypeGroup(a.data.subject_type)]++;

  const CARDS = [
    { key: 'radical',    label: 'Radicals',  cls: 'radical' },
    { key: 'kanji',      label: 'Kanji',     cls: 'kanji'   },
    { key: 'vocabulary', label: 'Vocabulary',cls: 'vocab'   },
  ];
  document.getElementById('typeBreakdown').innerHTML = CARDS.map(({ key, label, cls }) => `
    <button class="type-count-card ${cls}" onclick="showTypeTab('${key}')">
      <span class="tcc-dot"></span>
      <span class="tcc-body">
        <span class="tcc-count">${counts[key].toLocaleString()}</span>
        <span class="tcc-label">${label}</span>
      </span>
    </button>
  `).join('');
}

// ── Period buttons ─────────────────────────────────────────────────────────

function renderPeriodButtons() {
  document.getElementById('periodBtns').innerHTML = PERIODS.map(p => `
    <button class="period-btn${p === state.period ? ' active' : ''}"
            onclick="setPeriod(${p})">${p} days</button>
  `).join('');
}

function setPeriod(p) {
  state.period = p;
  renderPeriodButtons();
  renderTypeBreakdown();
  renderChart();
  closeDetailPanel();
}

// ── Chart ──────────────────────────────────────────────────────────────────

function renderChart() {
  const days   = daysArray(state.period);
  const counts = days.map(d => filteredForDay(d).length);
  const today  = todayStr();

  const colors = days.map(d => {
    if (d === state.selectedDate) return 'rgba(241,0,161,0.75)';
    if (d === today)              return 'rgba(241,0,161,0.9)';
    return 'rgba(241,0,161,0.22)';
  });

  const labels = days.map(d =>
    new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
  );

  const css       = getComputedStyle(document.documentElement);
  const gridColor = css.getPropertyValue('--border').trim();
  const tickColor = css.getPropertyValue('--muted').trim();

  const ctx = document.getElementById('reviewChart').getContext('2d');
  if (state.chart) state.chart.destroy();

  state.chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: counts,
        backgroundColor: colors,
        borderColor: colors.map(c => c.replace(/[\d.]+\)$/, '1)')),
        borderWidth: 1,
        borderRadius: 3,
        hoverBackgroundColor: 'rgba(241,0,161,0.75)',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onClick(event, elements) {
        if (!elements.length) return;
        selectDay(days[elements[0].index]);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ([item]) => friendlyDate(days[item.dataIndex]),
            label: item => `${item.parsed.y} reviews`,
          }
        }
      },
      scales: {
        x: {
          grid:  { color: gridColor },
          ticks: { color: tickColor, maxRotation: 45, autoSkip: true,
                   maxTicksLimit: state.period <= 30 ? state.period : 20 }
        },
        y: {
          grid: { color: gridColor },
          ticks: { color: tickColor, precision: 0 },
          beginAtZero: true,
        }
      }
    }
  });
}

// ── Tab panel ──────────────────────────────────────────────────────────────

function switchTab(tab) {
  state.activeTab = tab;
  document.getElementById('tabBtnDay') .classList.toggle('active', tab === 'day');
  document.getElementById('tabBtnType').classList.toggle('active', tab === 'type');
  document.getElementById('tabDay') .classList.toggle('active', tab === 'day');
  document.getElementById('tabType').classList.toggle('active', tab === 'type');
}

function openDetailPanel(tab) {
  document.getElementById('detailPanel').style.display = 'block';
  switchTab(tab);
  document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetailPanel() {
  document.getElementById('detailPanel').style.display = 'none';
  document.getElementById('tabDay').innerHTML  = '';
  document.getElementById('tabType').innerHTML = '';
  state.activeTab    = null;
  state.selectedDate = null;
  renderChart();
}

// ── Item cards ─────────────────────────────────────────────────────────────

function buildItemCards(items, showDue = false) {
  const today = todayStr();
  return items.map(a => {
    const s = state.subjectCache[a.data.subject_id];
    if (!s) return '';

    const type    = s.object;
    const char    = s.data.characters ?? s.data.slug ?? '?';
    const meaning = s.data.meanings?.find(m => m.primary)?.meaning ?? '';
    const reading = s.data.readings?.find(r => r.primary)?.reading ?? '';
    const srs     = a.data.srs_stage;
    const srsInfo = SRS_INFO[srs];
    const url     = wkUrl(s);

    const mHasTip = !!s.data.meaning_mnemonic;
    const rHasTip = !!s.data.reading_mnemonic;

    let dueHtml = '';
    if (showDue) {
      const dueKey   = a.data.available_at ? dateStr(a.data.available_at) : null;
      const dueLabel = !dueKey || dueKey <= today ? 'Due today' : `Due ${friendlyDate(dueKey)}`;
      dueHtml = `<div class="item-due">${dueLabel}</div>`;
    }

    return `
      <div class="item-card ${type}">
        <div class="char">${char}</div>
        <a class="type-badge" href="${url}" target="_blank" rel="noopener noreferrer">${type.replace('_', ' ')}</a>
        <div class="item-meaning${mHasTip ? ' has-tooltip' : ''}"
             ${mHasTip ? `onmouseenter="showMnemonicTooltip(this,${s.id},'meaning')" onmouseleave="hideTooltip()"` : ''}>${meaning}</div>
        ${reading ? `<div class="item-reading${rHasTip ? ' has-tooltip' : ''}"
             ${rHasTip ? `onmouseenter="showMnemonicTooltip(this,${s.id},'reading')" onmouseleave="hideTooltip()"` : ''}>${reading}</div>` : ''}
        ${srsInfo ? `<div class="srs-pip" style="background:${srsInfo.color}22;color:${srsInfo.color};">${srsInfo.label}</div>` : ''}
        ${dueHtml}
      </div>`;
  }).join('');
}

// ── Day tab ────────────────────────────────────────────────────────────────

async function selectDay(date) {
  state.selectedDate = date;
  renderChart();

  const allItems = state.dayGroups[date] ?? [];
  const items    = allItems.filter(assignmentMatchesFilters);
  document.getElementById('tabBtnDay').textContent =
    `${friendlyDate(date)} · ${items.length} review${items.length !== 1 ? 's' : ''}`;

  openDetailPanel('day');
  await renderDayTab(date);
}

async function renderDayTab(date) {
  const allItems = state.dayGroups[date] ?? [];
  const items    = allItems.filter(assignmentMatchesFilters);
  const label    = friendlyDate(date);
  const tab      = document.getElementById('tabDay');

  if (!items.length) {
    tab.innerHTML = `<div class="tab-heading">${label} — No reviews scheduled</div>`;
    return;
  }

  const hiddenCount = allItems.length - items.length;
  const hiddenNote  = hiddenCount > 0
    ? ` <span style="color:var(--muted);font-size:0.75rem;">(${hiddenCount} hidden by filter)</span>` : '';

  tab.innerHTML = `<div class="tab-heading">${label} — ${items.length} review${items.length !== 1 ? 's' : ''}${hiddenNote}</div>
    <div style="color:var(--muted);font-size:0.8rem;margin-bottom:0.75rem;">Loading items…</div>`;

  try {
    await ensureSubjects(items.map(a => a.data.subject_id));
  } catch (e) {
    tab.innerHTML += `<div style="color:#f85149;font-size:0.8rem;">${e.message}</div>`;
    return;
  }

  tab.innerHTML = `<div class="tab-heading">${label} — ${items.length} review${items.length !== 1 ? 's' : ''}${hiddenNote}</div>
    <div class="items-grid">${buildItemCards(items)}</div>`;
}

// ── Type tab ───────────────────────────────────────────────────────────────

async function showTypeTab(type) {
  const TYPE_LABELS = { radical: 'Radicals', kanji: 'Kanji', vocabulary: 'Vocabulary' };
  const days  = daysArray(state.period);
  const items = days.flatMap(d => state.dayGroups[d] ?? [])
                    .filter(a => subjectTypeGroup(a.data.subject_type) === type);
  const label = TYPE_LABELS[type];

  document.getElementById('tabBtnType').textContent = `${items.length.toLocaleString()} ${label}`;
  openDetailPanel('type');

  const tab = document.getElementById('tabType');

  if (!items.length) {
    tab.innerHTML = `<div class="tab-heading">No ${label} in the next ${state.period} days</div>`;
    return;
  }

  tab.innerHTML = `<div class="tab-heading">${items.length.toLocaleString()} ${label} · next ${state.period} days</div>
    <div style="color:var(--muted);font-size:0.8rem;margin-bottom:0.75rem;">Loading items…</div>`;

  try {
    await ensureSubjects(items.map(a => a.data.subject_id));
  } catch (e) {
    tab.innerHTML += `<div style="color:#f85149;font-size:0.8rem;">${e.message}</div>`;
    return;
  }

  tab.innerHTML = `<div class="tab-heading">${items.length.toLocaleString()} ${label} · next ${state.period} days</div>
    <div class="items-grid">${buildItemCards(items, true)}</div>`;
}

// ── Mnemonic tooltip ───────────────────────────────────────────────────────

function formatMnemonic(text) {
  if (!text) return '';
  return text
    .replace(/<radical>(.*?)<\/radical>/gs,      '<span style="color:var(--radical);font-weight:600;">$1</span>')
    .replace(/<kanji>(.*?)<\/kanji>/gs,          '<span style="color:var(--kanji);font-weight:600;">$1</span>')
    .replace(/<vocabulary>(.*?)<\/vocabulary>/gs,'<span style="color:var(--vocab);font-weight:600;">$1</span>')
    .replace(/<meaning>(.*?)<\/meaning>/gs,      '<span style="color:#e3b341;font-weight:600;">$1</span>')
    .replace(/<reading>(.*?)<\/reading>/gs,      '<span style="color:#58a6ff;font-weight:600;">$1</span>')
    .replace(/<ja>(.*?)<\/ja>/gs,                '<span style="font-style:italic;">$1</span>')
    .replace(/<[^>]+>/g, '');
}

function showMnemonicTooltip(el, subjectId, type) {
  const s   = state.subjectCache[subjectId];
  const raw = type === 'meaning' ? s?.data?.meaning_mnemonic : s?.data?.reading_mnemonic;
  if (!raw) return;

  const tip = document.getElementById('tooltip');
  tip.innerHTML  = formatMnemonic(raw);
  tip.style.display = 'block';

  const er = el.getBoundingClientRect();
  const tr = tip.getBoundingClientRect();
  let top  = er.top  - tr.height - 8;
  let left = er.left + er.width / 2 - tr.width / 2;

  if (top < 8)                                 top  = er.bottom + 8;
  if (left < 8)                                left = 8;
  if (left + tr.width > window.innerWidth - 8) left = window.innerWidth - tr.width - 8;

  tip.style.top  = top  + 'px';
  tip.style.left = left + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ── Status / error ─────────────────────────────────────────────────────────

function showStatus(msg) {
  const el = document.getElementById('statusMsg');
  el.textContent  = msg;
  el.style.display = 'block';
}

function hideStatus() {
  document.getElementById('statusMsg').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent  = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

// ── Init ───────────────────────────────────────────────────────────────────

loadTheme();

const savedToken = localStorage.getItem('wk_token');
if (savedToken) {
  state.token = savedToken;
  loadData();
} else {
  openSettings();
}
</script>
